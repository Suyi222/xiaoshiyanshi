<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒计时花盆</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box }
        body {
            background: linear-gradient(180deg, #e8f5e8 0%, #c8e6c8 50%, #a5d6a7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        .card {
            background: rgba(255,255,255,0.88);
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 360px;
            width: 90%;
            backdrop-filter: blur(10px);
        }
        h2 { color: #3d7a3d; font-size: 22px; margin-bottom: 6px; }
        .sub { font-size: 13px; color: #888; margin-bottom: 18px; }
        .pot-area {
            position: relative;
            height: 180px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin: 10px 0;
        }
        .pot { font-size: 60px; position: relative; z-index: 2; transition: all 0.5s; }
        .plant-stage {
            position: absolute;
            bottom: 55px;
            font-size: 50px;
            transition: all 0.5s;
            animation: sway 3s ease-in-out infinite;
        }
        @keyframes sway {
            0%,100% { transform: rotate(-2deg) }
            50% { transform: rotate(2deg) }
        }
        .days-num { font-size: 56px; font-weight: bold; color: #3d7a3d; margin: 8px 0; }
        .days-label { font-size: 14px; color: #888; }
        .target-info {
            font-size: 13px;
            color: #666;
            margin-top: 10px;
            background: #f5faf5;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
        }
        .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
        .btn {
            border: none;
            padding: 10px 20px;
            border-radius: 22px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-set { background: #3d7a3d; color: white; }
        .btn-set:hover { opacity: 0.85; }
        .btn-reset { background: transparent; border: 2px solid #c8e6c8; color: #666; }
        .btn-reset:hover { background: #f0f8f0; }
        .modal-mask {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-mask.show { display: flex; }
        .modal-box {
            background: white;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.2);
            text-align: center;
        }
        .modal-box h3 { color: #3d7a3d; margin-bottom: 15px; }
        .modal-box input {
            border: 2px solid #c8e6c8;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            font-size: 15px;
            outline: none;
            text-align: center;
            margin-bottom: 8px;
        }
        .modal-box input:focus { border-color: #3d7a3d; }
        .modal-box .label { font-size: 13px; color: #999; margin-bottom: 12px; }
        .modal-box .hint { font-size: 11px; color: #bbb; margin-bottom: 12px; }
        .past { color: #c0392b!important; }
        .past-label {
            font-size: 12px;
            color: #c0392b;
            margin-top: 5px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1 }
            50% { opacity: 0.5 }
        }
        @media (max-width: 400px) {
            .card { padding: 20px 15px }
            .days-num { font-size: 42px }
            .pot-area { height: 140px }
            .pot { font-size: 48px }
            .plant-stage { font-size: 38px; bottom: 45px }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>倒计时花盆</h2>
        <p class="sub" id="eventLabel">等待一朵花开</p>
        <div class="pot-area">
            <span class="plant-stage" id="plant"></span>
            <span class="pot">[盆]</span>
        </div>
        <div class="days-num" id="daysNum">--</div>
        <div class="days-label" id="daysLabel">设置一个日期吧</div>
        <div class="target-info" id="targetInfo"></div>
        <div class="past-label" id="pastLabel" style="display:none"></div>
        <div class="btn-row">
            <button class="btn btn-set" onclick="showModal()">设定日期</button>
            <button class="btn btn-reset" onclick="clearDate()">重置</button>
        </div>
    </div>
    <div class="modal-mask" id="modal" onclick="if(event.target===this)closeModal()">
        <div class="modal-box">
            <h3>种下一个日期</h3>
            <div class="label">选择你期待的那一天</div>
            <input type="date" id="dateInput">
            <div class="hint" id="modalHint"></div>
            <div class="btn-row">
                <button class="btn btn-reset" onclick="closeModal()">取消</button>
                <button class="btn btn-set" onclick="saveDate()">种下</button>
            </div>
        </div>
    </div>
    <script>
        var STOR = 'cd_pot_v1';
        var target = null;

        function loadDate() {
            var s = localStorage.getItem(STOR);
            if (s) {
                target = new Date(s);
                if (isNaN(target.getTime())) { target = null; return; }
            }
            render();
        }

        function saveDate() {
            var inp = document.getElementById('dateInput');
            if (!inp.value) { alert('请选择一个日期哦'); return; }
            target = new Date(inp.value + 'T23:59:59');
            localStorage.setItem(STOR, target.toISOString());
            closeModal();
            render();
        }

        function clearDate() {
            if (confirm('确定要移除这株小花吗？')) {
                target = null;
                localStorage.removeItem(STOR);
                render();
            }
        }

        function showModal() {
            var inp = document.getElementById('dateInput');
            var today = new Date();
            today.setHours(0,0,0,0);
            inp.min = today.toISOString().split('T')[0];
            if (target) {
                var d = new Date(target);
                d.setHours(0,0,0,0);
                inp.value = d.toISOString().split('T')[0];
            }
            document.getElementById('modalHint').textContent = '选未来某一天，花盆会慢慢长出小芽';
            document.getElementById('modal').classList.add('show');
            setTimeout(function() { inp.focus(); }, 200);
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        function render() {
            var now = new Date();
            var dn = document.getElementById('daysNum');
            var dl = document.getElementById('daysLabel');
            var ti = document.getElementById('targetInfo');
            var pl = document.getElementById('pastLabel');
            var el = document.getElementById('eventLabel');
            var plant = document.getElementById('plant');

            if (!target) {
                dn.textContent = '--';
                dl.textContent = '设置一个日期吧';
                ti.textContent = '';
                pl.style.display = 'none';
                el.textContent = '等待一朵花开';
                plant.textContent = '';
                dn.classList.remove('past');
                return;
            }

            var diff = target.getTime() - now.getTime();
            var days = Math.ceil(diff / (1000*60*60*24));
            var absDays = Math.abs(days);
            var dateStr = target.getFullYear() + '/' + (target.getMonth()+1) + '/' + target.getDate();

            if (days > 0) {
                dn.textContent = days;
                dn.classList.remove('past');
                dl.textContent = '天';
                ti.textContent = dateStr;
                pl.style.display = 'none';
                el.textContent = '静静等待...';
                if (days > 365) plant.textContent = '\u{1F330}';
                else if (days > 180) plant.textContent = '\u{1F331}';
                else if (days > 90) plant.textContent = '\u{1F33F}';
                else if (days > 30) plant.textContent = '\u{1F333}';
                else if (days > 7) plant.textContent = '\u{1F337}';
                else plant.textContent = '\u{1F338}';
            } else if (days === 0) {
                dn.textContent = '今天!';
                dn.classList.remove('past');
                dl.textContent = '就是今天！';
                ti.textContent = dateStr;
                pl.style.display = 'none';
                el.textContent = '花开了！';
                plant.textContent = '\u{1F33B}';
            } else {
                dn.textContent = absDays;
                dn.classList.add('past');
                dl.textContent = '天前';
                ti.textContent = dateStr;
                pl.style.display = 'block';
                pl.textContent = '已经过去 ' + absDays + ' 天啦';
                el.textContent = '那天的花谢了';
                plant.textContent = '\u{1F940}';
            }
        }

        loadDate();
        setInterval(render, 60000);
    </script>
</body>
</html>
