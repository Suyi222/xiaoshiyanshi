<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌳 小园丁的试验田</title>
    <style>
        :root {
            --bg: #f5faf5;
            --panel: #ffffff;
            --border: #c8e6c8;
            --text: #2d3a2d;
            --accent: #4a8f4a;
            --green: #3d7a3d;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
            --petal: #88cc88;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s, color 0.5s;
            position: relative;
            overflow-x: hidden;
        }

        /* 飘落物 */
        .petal {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            animation: fall linear forwards;
            opacity: 0.7;
            font-size: 20px;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.7; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        @keyframes fallSnow {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(40px) rotate(360deg); opacity: 0; }
        }

        /* 顶部菜单栏 */
        .menu-bar {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: var(--shadow);
            z-index: 10;
            flex-shrink: 0;
            flex-wrap: wrap;
            position: relative;
        }
        .logo { font-size: 20px; font-weight: bold; color: var(--green); cursor: pointer; }
        .menu-btn {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .menu-btn.active { background: var(--green); color: white; border-color: var(--green); }
        .spacer { flex: 1; }
        .current-app { font-size: 13px; opacity: 0.6; white-space: nowrap; }

        /* 时间显示 */
        .time-display {
            text-align: center;
            font-size: 14px;
            opacity: 0.7;
            margin: 8px 0 2px;
            z-index: 2;
            position: relative;
        }

        /* 主题切换面板 */
        .theme-panel-container {
            position: relative;
            display: inline-block;
        }
        .theme-toggle-btn {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .theme-toggle-btn:hover { background: var(--border); }
        .theme-panel {
            display: none;
            position: absolute;
            top: 40px;
            right: 0;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            z-index: 100;
            min-width: 200px;
        }
        .theme-panel.show { display: block; }
        .theme-panel h4 {
            font-size: 14px;
            opacity: 0.6;
            margin-bottom: 10px;
            text-align: center;
        }
        .theme-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .theme-option:hover { background: var(--border); }
        .theme-option.active-theme { background: var(--border); font-weight: bold; }
        .theme-option .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--border);
            flex-shrink: 0;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            position: relative;
            z-index: 1;
        }

        /* 分类区域 */
        .section { margin-bottom: 30px; }
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            margin-bottom: 15px;
        }
        .section-header h2 { font-size: 20px; color: var(--green); }
        .section-header .arrow { font-size: 16px; transition: transform 0.3s; }
        .section-header .count { font-size: 14px; opacity: 0.5; }
        .section.collapsed .card-grid { display: none; }
        .section.collapsed .arrow { transform: rotate(-90deg); }

        /* 卡片网格 */
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px 20px;
            width: 180px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .card:hover { border-color: var(--accent); transform: translateY(-4px); }
        .card .icon { font-size: 40px; }
        .card .name { font-size: 16px; font-weight: bold; }
        .card .tag { font-size: 11px; opacity: 0.6; }
        .card .delete-btn {
            position: absolute; top: 8px; right: 8px;
            background: transparent; border: none;
            color: #ccc; cursor: pointer; font-size: 16px;
            padding: 2px 6px; border-radius: 50%;
            opacity: 0; transition: all 0.2s;
        }
        .card:hover .delete-btn { opacity: 1; }
        .card .delete-btn:hover { color: #e57373; background: #fff0f0; }
        .card.add-card {
            border-style: dashed; border-color: var(--accent);
            color: var(--accent); opacity: 0.8;
        }
        .card.add-card:hover { opacity: 1; background: #f0faf0; }

        /* 编辑器视图 */
        .editor-view {
            display: flex; width: 100%; height: 100%; gap: 0;
        }
        .editor-panel {
            width: 50%; display: flex; flex-direction: column;
            border-right: 1px solid var(--border);
        }
        .editor-panel textarea {
            flex: 1; background: #1a1a2e; color: #e0e0e0;
            border: none; padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px; resize: none; outline: none; line-height: 1.6;
        }
        .preview-panel {
            width: 50%; display: flex; flex-direction: column;
        }
        .preview-panel iframe { flex: 1; border: none; background: white; }
        .editor-toolbar {
            background: var(--panel); padding: 10px 20px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid var(--border);
        }
        .editor-toolbar button {
            padding: 8px 16px; border-radius: 20px;
            border: none; cursor: pointer; font-size: 13px; font-weight: bold;
        }
        .btn-run { background: var(--green); color: white; }
        .btn-save { background: var(--accent); color: white; }

        /* 底部格言 */
        .footer-quote {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            opacity: 0.6;
            z-index: 2;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.3s;
            position: relative;
        }
        .footer-quote:hover { opacity: 1; }

        @media (max-width: 768px) {
            .editor-view { flex-direction: column; }
            .editor-panel { width: 100%; height: 50%; border-right: none; border-bottom: 1px solid var(--border); }
            .preview-panel { width: 100%; height: 50%; }
        }
        @media (max-width: 500px) {
            .card { width: 140px; height: 140px; padding: 15px; }
            .card .icon { font-size: 30px; }
            .card .name { font-size: 13px; }
            .main-content { padding: 20px; }
        }
        /* 时间日期节气 */
        .time-bar {
            text-align: center;
            font-size: 14px;
            opacity: 0.7;
            margin: 8px 0 2px;
            z-index: 2;
            position: relative;
            cursor: default;
        }
        /* 小精灵 */
        .fairy {
            position: fixed; bottom: 20px; right: 20px;
            z-index: 50; cursor: pointer; user-select: none;
            transition: transform 0.3s;
        }
        .fairy:hover { transform: scale(1.1); }
        .fairy .icon { font-size: 40px; }
        .fairy .bubble {
            position: absolute; bottom: 50px; right: 0;
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 16px; padding: 10px 14px;
            font-size: 13px; max-width: 200px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            animation: fadeIn 0.3s ease-out;
            white-space: nowrap;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 太极图标 */
        .taiji-icon {
            font-size: 28px; cursor: pointer; transition: transform 0.2s;
            user-select: none; z-index: 2; display: inline-block;
            vertical-align: middle; margin-left: 10px;
        }
        .taiji-icon:hover { transform: rotate(20deg); }
        .taiji-icon.used { opacity: 0.5; cursor: default; }
        .taiji-icon.used:hover { transform: none; }
        /* 占卜面板 */
        .divination-panel {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel); border: 2px solid var(--border);
            border-radius: 20px; padding: 25px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.15); z-index: 200;
            text-align: center; max-width: 400px; width: 90%;
        }
        .divination-panel.show { display: block; }
        .divination-panel .close-btn {
            position: absolute; top: 10px; right: 15px;
            background: transparent; border: none; font-size: 20px;
            cursor: pointer; color: var(--text); opacity: 0.5;
        }
        .divination-panel .close-btn:hover { opacity: 1; }
        .yao-line {
            font-size: 22px; margin: 3px 0;
            font-family: monospace; letter-spacing: 4px;
        }
        .yao-line.born { animation: popIn 0.3s ease-out; }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .btn-shake {
            background: var(--green); color: white; border: none;
            padding: 12px 28px; border-radius: 25px;
            cursor: pointer; font-size: 16px; font-weight: bold;
            margin-top: 15px; transition: all 0.2s;
        }
        .btn-shake:hover { opacity: 0.9; }
        .btn-shake:active { transform: scale(0.97); }
        .result-area {
            margin-top: 15px; text-align: left;
            font-size: 14px; line-height: 1.8;
        }
        .result-area .gua-name {
            font-size: 20px; font-weight: bold;
            color: var(--green); text-align: center; margin-bottom: 8px;
        }
        .result-area .yi, .result-area .ji {
            margin-top: 10px; padding: 8px 12px;
            border-radius: 10px; background: #f0faf0;
        }
        .result-area .ji { background: #fff5f5; }
        .overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); z-index: 150;
        }
        .overlay.show { display: block; }
    </style>
</head>
<body>
    <!-- 飘落花瓣容器 -->
    <div id="petalContainer"></div>

    <!-- 顶部菜单栏 -->
    <div class="menu-bar">
        <span class="logo" onclick="showLibrary()">🌳 小园丁的试验田</span>
        <button class="menu-btn active" id="btn-library" onclick="showLibrary()">🌱 试验田</button>
        <button class="menu-btn" id="btn-editor" onclick="showEditor()">🧑‍🌾 栽培管理</button>
        <button class="menu-btn" id="btn-runapp" onclick="showRunApp()" style="display:none;">🍅 收获中</button>
        <span class="spacer"></span>
        <button class="menu-btn" onclick="exportData()" title="导出数据备份">📤 导出</button>
        <button class="menu-btn" onclick="importData()" title="从备份恢复数据">📥 导入</button>
        <input type="file" id="importFileInput" style="display:none" accept=".json" onchange="handleImport(event)">
        <!-- 四季调色盘 -->
        <div class="theme-panel-container">
            <button class="theme-toggle-btn" onclick="toggleThemePanel()" title="四季调色盘">🎨</button>
            <div class="theme-panel" id="themePanel">
                <h4>🎨 四季调色盘</h4>
                <div class="theme-option" onclick="applyTheme('spring')" id="opt-spring">
                    <span class="dot" style="background:#ffb7c5;"></span> 🌸 春 · 樱花粉
                </div>
                <div class="theme-option" onclick="applyTheme('summer')" id="opt-summer">
                    <span class="dot" style="background:#88cc88;"></span> 🍃 夏 · 小园丁绿
                </div>
                <div class="theme-option" onclick="applyTheme('autumn')" id="opt-autumn">
                    <span class="dot" style="background:#f0c060;"></span> 🍂 秋 · 落日金
                </div>
                <div class="theme-option" onclick="applyTheme('winter')" id="opt-winter">
                    <span class="dot" style="background:#8899cc;"></span> 🌙 冬 · 夜晚模式
                </div>
            </div>
        </div>
        <span class="current-app" id="currentAppName"></span>
    </div>

      <!-- 时间日期节气 -->
        <div class="time-bar">
        <span id="timeBarText">🕐 加载中...</span>
        <span class="taiji-icon" id="taijiIcon" onclick="startDivination()" title="每日一卦">☯️</span>
    </div>

 <!-- 主视图 -->
    <div class="main-content" id="mainContent">
        <!-- 试验田视图 -->
        <div id="libraryView">
            <!-- 小果园 -->
            <div class="section" id="sectionOrchard">
                <div class="section-header" onclick="toggleSection('sectionOrchard')">
                    <span class="arrow">▼</span>
                    <h2>🧰 小果园</h2>
                    <span class="count" id="orchardCount"></span>
                </div>
                <div class="card-grid" id="orchardGrid"></div>
            </div>
            <!-- 菜篮子 -->
            <div class="section" id="sectionBasket">
                <div class="section-header" onclick="toggleSection('sectionBasket')">
                    <span class="arrow">▼</span>
                    <h2>🎮 菜篮子</h2>
                    <span class="count" id="basketCount"></span>
                </div>
                <div class="card-grid" id="basketGrid"></div>
            </div>
        </div>

        <!-- 栽培管理视图 -->
        <div class="editor-view" id="editorView" style="display:none;">
            <div class="editor-panel">
                <div class="editor-toolbar">
                    <span style="font-size:13px;opacity:0.6;">🧑‍🌾 育苗间</span>
                    <span style="flex:1;"></span>
                    <button class="btn-run" onclick="runEditorCode()">▶️ 试收获</button>
                    <button class="btn-save" onclick="saveEditorCode()">💾 收入谷仓</button>
                </div>
                <textarea id="editorTextarea">欢迎来到育苗间！你想种下怎样的植物？</textarea>
            </div>
            <div class="preview-panel">
                <iframe id="previewFrame"></iframe>
            </div>
        </div>

        <!-- 收获视图 -->
        <div id="runAppView" style="display:none;width:100%;height:100%;">
            <iframe id="runAppFrame" style="width:100%;height:100%;border:none;"></iframe>
        </div>
    </div>

    <!-- 底部格言 -->
    <div class="footer-quote" id="footerQuote" onclick="changeQuote()"></div>

    <script>
        // ============ 数据管理 ============
        function loadApps() {
            const saved = localStorage.getItem('myLabApps_v4');
            return saved ? JSON.parse(saved) : [];
        }
        function saveApps(apps) {
            localStorage.setItem('myLabApps_v4', JSON.stringify(apps));
        }
        function loadHarvestCount() {
            return parseInt(localStorage.getItem('harvestCount') || '0');
        }
        function addHarvest() {
            let c = loadHarvestCount() + 1;
            localStorage.setItem('harvestCount', c);
        }

        // ============ 导入导出 ============
        function exportData() {
            const data = {
                apps: loadApps(),
                harvestCount: loadHarvestCount(),
                theme: currentTheme,
                exportedAt: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'xiaoyuanding_backup_' + new Date().toISOString().slice(0,10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData() {
            document.getElementById('importFileInput').click();
        }

        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.apps || !Array.isArray(data.apps)) {
                        alert('⚠️ 文件格式不正确，请选择有效的备份文件。');
                        return;
                    }
                    if (confirm('导入将覆盖当前的试验田数据（共 ' + data.apps.length + ' 个应用），确定继续吗？\n\n导出时间：' + (data.exportedAt || '未知'))) {
                        saveApps(data.apps);
                        apps = loadApps();
                        if (data.harvestCount !== undefined) {
                            localStorage.setItem('harvestCount', data.harvestCount);
                        }
                        if (data.theme) {
                            applyTheme(data.theme);
                        }
                        renderLibrary();
                        alert('✅ 导入成功！共恢复了 ' + data.apps.length + ' 个应用 🌱');
                    }
                } catch (err) {
                    alert('⚠️ 文件解析失败，请检查文件是否完整。');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function getDefaultApps() {
            return [
                { name: '番茄钟', icon: '🍅', category: 'orchard', code: `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>body{background:#0a1a0a;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;flex-direction:column;}.timer{font-size:80px;color:#66bb66;margin:20px;}.btn{background:#66bb66;color:#000;border:none;padding:14px 35px;font-size:18px;border-radius:30px;cursor:pointer;margin:8px;}</style></head><body><div class="timer" id="t">25:00</div><button class="btn" onclick="toggle()">▶️ 开始</button><script>let m=25,s=0,iv=null,r=false;function u(){document.getElementById('t').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}function toggle(){if(r){clearInterval(iv);r=false;document.querySelector('.btn').textContent='▶️ 继续';}else{iv=setInterval(()=>{if(s===0){if(m===0){clearInterval(iv);r=false;document.querySelector('.btn').textContent='🎉 完成!';m=25;s=0;u();return;}m--;s=59;}else{s--;}u();},1000);r=true;document.querySelector('.btn').textContent='⏸️ 暂停';}}u();<\/script></body></html>` },
                { name: '烟花颜文字', icon: '🎆', category: 'basket', code: `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>🎆 烟花颜文字</title><style>body{margin:0;background:#0a0a2a;overflow:hidden;height:100vh;cursor:crosshair;font-family:sans-serif;}canvas{display:block;}.hint{position:fixed;bottom:30px;width:100%;text-align:center;color:rgba(255,255,255,0.6);font-size:16px;pointer-events:none;z-index:10;}.kaomoji-pop{position:fixed;font-size:28px;pointer-events:none;z-index:20;animation:popUp 1.5s ease-out forwards;white-space:nowrap;}@keyframes popUp{0%{opacity:1;transform:translateY(0) scale(0.5);}30%{opacity:1;transform:translateY(-30px) scale(1.2);}100%{opacity:0;transform:translateY(-120px) scale(1);}}</style></head><body><canvas id="canvas"></canvas><div class="hint">✨ 点击屏幕放烟花 ✨</div><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let W,H;function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}resize();window.addEventListener('resize',resize);class Particle{constructor(x,y,c){this.x=x;this.y=y;this.color=c;let a=Math.random()*Math.PI*2,s=Math.random()*6+2;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.life=1;this.decay=Math.random()*0.02+0.01;this.size=Math.random()*3+1;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.05;this.life-=this.decay;}draw(c){c.globalAlpha=this.life;c.fillStyle=this.color;c.beginPath();c.arc(this.x,this.y,this.size,0,Math.PI*2);c.fill();c.globalAlpha=1;}}class Firework{constructor(x,y){this.x=x;this.y=y;let colors=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff8fe8','#ffb347','#00e5ff','#ff4081','#7c4dff','#ffab40','#69f0ae','#ff80ab'];this.particles=[];let c=colors[Math.floor(Math.random()*colors.length)];for(let i=0;i<80;i++)this.particles.push(new Particle(x,y,c));}update(){this.particles.forEach(p=>p.update());this.particles=this.particles.filter(p=>p.life>0);}draw(c){this.p             const terms = [

                [y,3,5,'惊蛰'],[y,3,20,'春分'],[y,4,4,'清明'],[y,4,19,'谷雨'],
                [y,5,5,'立夏'],[y,5,20,'小满'],[y,6,5,'芒种'],[y,6,21,'夏至'],
                [y,7,6,'小暑'],[y,7,22,'大暑'],[y,8,7,'立秋'],[y,8,22,'处暑'],
                [y,9,7,'白露'],[y,9,22,'秋分'],[y,10,7,'寒露'],[y,10,23,'霜降'],
                [y,11,7,'立冬'],[y,11,22,'小雪'],[y,12,6,'大雪'],[y,12,21,'冬至']
            ];
            const now = date.getTime();
            let term = '冬至';
            for (const [yy, mm, dd, name] of terms) {
                if (now >= new Date(yy, mm-1, dd).getTime()) term = name;
                else break;
            }
            return term;
        }

        function checkDivinationReset() {
            var today = new Date().toDateString();
            var saved = localStorage.getItem('divinationDate');
            if (saved !== today) {
                localStorage.setItem('divinationDate', today);
                localStorage.removeItem('divinationResult');
                divinationDone = false;
                yaoCount = 0;
                yaoLines = [];
                document.getElementById('taijiIcon').classList.remove('used');
                document.getElementById('resultArea').style.display = 'none';
                document.getElementById('btnShake').style.display = 'inline-block';
                document.getElementById('yaoContainer').innerHTML = '';
            } else if (localStorage.getItem('divinationResult')) {
                divinationDone = true;
                document.getElementById('taijiIcon').classList.add('used');
            }
        }

                       function startDivination() {
            checkDivinationReset();
            document.getElementById('divinationPanel').classList.add('show');
            document.getElementById('overlay').classList.add('show');
            if (divinationDone) {
                // 今天已摇过，直接展示结果
                document.getElementById('btnShake').style.display = 'none';
                document.getElementById('resultArea').style.display = 'block';
                // 重新渲染爻线
                var container = document.getElementById('yaoContainer');
                container.innerHTML = '';
                for (var i = 0; i < yaoLines.length; i++) {
                    var el = document.createElement('div');
                    el.className = 'yao-line';
                    el.textContent = yaoLines[i] === 1 ? '▅▅▅▅▅▅▅' : '▅▅   ▅▅';
                    container.appendChild(el);
                }
                // 恢复卦象结果
                var saved = localStorage.getItem('divinationResult');
                if (saved) {
                    var data = JSON.parse(saved);
                    var html = '<div class="gua-name">䷀ ' + data.guaName + '</div>';
                    html += '<p style="text-align:center;font-style:italic;margin-bottom:10px;">"' + data.humor + '"</p>';
                    if (data.yis && data.jis) {
                        html += '<div class="yi"><b>✅ 今日宜：</b><br>' + data.yis.map(function(y){ return '· ' + y.text; }).join('<br>') + '</div>';
                        html += '<div class="ji"><b>❌ 今日忌：</b><br>' + data.jis.map(function(j){ return '· ' + j.gentle; }).join('<br>') + '</div>';
                    }
                    document.getElementById('resultArea').innerHTML = html;
                }
            } else {
                // 还没摇过，展示摇卦界面
                document.getElementById('resultArea').style.display = 'none';
                document.getElementById('btnShake').style.display = 'inline-block';
                document.getElementById('yaoContainer').innerHTML = '';
            }
        }

            document.getElementById('divinationPanel').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');

                function weightedPick(items) {
                    var total = items.reduce(function(s, i) { return s + i.weight; }, 0);
                    var r = Math.random() * total;
                    for (var k = 0; k < items.length; k++) { r -= items[k].weight; if (r <= 0) return items[k]; }
                    return items[items.length - 1];
                }
                function pickN(items, n) {
                    var pool = items.slice();
                    var result = [];
                    for (var k = 0; k < n && pool.length > 0; k++) {
                        var picked = weightedPick(pool);
                        result.push(picked);
                        pool.splice(pool.indexOf(picked), 1);

            var saved = localStorage.getItem('divinationResult');
            if (!saved) return;
            var data = JSON.parse(saved);

            yaoCount = 6;

            var container = document.getElementById('yaoContainer');

                html += '<div class="ji"><b>❌ 今日忌：</b><br>' + data.jis.map(function(j){ return '· ' + j.gentle; }).join('<br>') + '</div>';

            document.getElementById('resultArea').innerHTML = html;
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('btnShake').style.display = 'none';
        }

        // 初始化时恢复今日卦象
        checkDivinationReset();
        if (localStorage.getItem('divinationResult')) {
            restoreDivination();
        }
