<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>故事书</title>
<style>
:root{--bg:#f5f0e8;--page:#faf7f2;--text:#4a3a2a;--accent:#8b7355;--gold:#b8956a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);display:flex;justify-content:center;align-items:center;height:100vh;font-family:'PingFang SC','Microsoft YaHei',serif;-webkit-tap-highlight-color:transparent}
.book{display:flex;flex-direction:column;background:linear-gradient(90deg,#e8d9c8 0%,#f0e5d8 5%,#faf7f2 15%,#faf7f2 85%,#f0e5d8 95%,#e8d9c8 100%);border-radius:12px 20px 20px 12px;box-shadow:0 8px 30px rgba(0,0,0,.12),4px 0 8px rgba(0,0,0,.06);max-width:500px;width:92%;height:82vh;max-height:620px;position:relative;overflow:hidden}
.book::before{content:'';position:absolute;left:0;top:0;width:18px;height:100%;background:linear-gradient(90deg,#c4a882,#d4b896,#c4a882);border-radius:8px 0 0 8px;box-shadow:2px 0 6px rgba(0,0,0,.1);z-index:10}
.toolbar{display:flex;gap:6px;padding:10px 16px 0 30px;z-index:5;flex-shrink:0;flex-wrap:wrap}
.tool-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:5px 11px;border-radius:12px;cursor:pointer;font-size:11px;transition:all .2s;font-family:inherit}
.tool-btn:hover{background:var(--accent);color:#fff}
.tool-btn.edit-btn{border-color:#7a9a6a;color:#7a9a6a}
.tool-btn.edit-btn:hover{background:#7a9a6a;color:#fff}
.tool-btn.del-btn{border-color:#c4a0a0;color:#c4a0a0}
.tool-btn.del-btn:hover{background:#c4a0a0;color:#fff}
.tool-btn.toc-btn{border-color:var(--gold);color:var(--gold);font-weight:bold}
.tool-btn.toc-btn:hover{background:var(--gold);color:#fff}
.page{flex:1;padding:8px 20px 20px 35px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#d4c0a8 transparent}
.page::-webkit-scrollbar{width:5px}
.page::-webkit-scrollbar-thumb{background:#d4c0a8;border-radius:3px}
.page-center{display:flex;flex-direction:column;align-items:center;text-align:center;min-height:100%;justify-content:center}
.page-num{text-align:right;font-size:10px;color:#c4b090;margin-bottom:8px}
.story-title{font-size:17px;color:var(--accent);margin-bottom:16px;font-weight:bold;letter-spacing:1px;text-align:center}
.story-time{text-align:center;font-size:10px;color:#c4b090;margin-bottom:12px}
.story-content{font-size:14px;line-height:2;color:var(--text);white-space:pre-wrap;word-break:break-word;text-align:left;max-width:100%}
.cover-center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100%}
.cover-center h2{color:var(--accent);font-size:20px;margin-bottom:6px}
.cover-center .sub{color:#c4b090;font-size:12px}
.cover-center .orn{font-size:36px;margin-bottom:12px}
.nav-bar{display:flex;gap:24px;justify-content:center;padding:0 0 16px 35px;flex-shrink:0}
.nav-btn{background:var(--accent);color:#fff;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;transition:all .2s;display:flex;align-items:center;justify-content:center}
.nav-btn:active{transform:scale(.95);opacity:.8}
.nav-btn:disabled{opacity:.3}
/* 目录浮层 */
.toc-overlay{display:none;position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:50;border-radius:12px 20px 20px 12px}
.toc-overlay.show{display:flex;align-items:center;justify-content:center}
.toc-panel{background:var(--page);border-radius:16px;width:85%;max-height:75%;overflow-y:auto;padding:20px;box-shadow:0 8px 40px rgba(0,0,0,.15)}
.toc-panel h3{text-align:center;color:var(--accent);margin-bottom:14px;font-size:17px}
.toc-item{padding:12px 10px;border-bottom:1px solid #e8dcc8;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;border-radius:8px}
.toc-item:hover{background:#f5f0e8}
.toc-item .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0}
.toc-item .toc-title{flex:1;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc-item .toc-date{font-size:10px;color:#c4b090;flex-shrink:0}
.toc-close{display:block;margin:10px auto 0;background:var(--accent);color:#fff;border:none;padding:8px 24px;border-radius:16px;cursor:pointer;font-size:13px;font-family:inherit}
/* 编辑弹窗 */
.edit-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}
.edit-overlay.show{display:flex}
.edit-box{background:#fff;border-radius:18px;padding:22px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.edit-box h3{text-align:center;color:var(--accent);margin-bottom:14px}
.edit-box label{font-size:12px;color:#999;display:block;margin:8px 0 3px}
.edit-box input,.edit-box textarea{width:100%;padding:10px 12px;border:2px solid #e8dcc8;border-radius:10px;font-size:14px;outline:none;font-family:inherit;color:var(--text)}
.edit-box textarea{resize:vertical;min-height:120px;line-height:1.7}
.edit-box input:focus,.edit-box textarea:focus{border-color:var(--accent)}
.edit-box .btn-row{display:flex;gap:10px;justify-content:center;margin-top:14px}
</style>
</head>
<body>
<div class="book" id="book">
  <div class="toolbar">
    <button class="tool-btn toc-btn" onclick="showTOC()">目录</button>
    <button class="tool-btn" onclick="addStory()">+ 新故事</button>
    <button class="tool-btn edit-btn" id="editBtn" onclick="editStory()" style="display:none">编辑</button>
    <button class="tool-btn del-btn" id="deleteBtn" onclick="deleteStory()" style="display:none">删除</button>
  </div>
  <div class="page" id="pageContainer"><div class="page-center" id="pageContent"></div></div>
  <div class="nav-bar">
    <button class="nav-btn" id="prevBtn" onclick="prevPage()">◀</button>
    <button class="nav-btn" id="nextBtn" onclick="nextPage()">▶</button>
  </div>
  <!-- 目录浮层 -->
  <div class="toc-overlay" id="tocOverlay" onclick="if(event.target===this)hideTOC()">
    <div class="toc-panel" id="tocPanel"><h3>目录</h3><div id="tocList"></div><button class="toc-close" onclick="hideTOC()">关闭</button></div>
  </div>
</div>
<!-- 编辑弹窗 -->
<div class="edit-overlay" id="editOverlay" onclick="if(event.target===this)closeEdit()">
  <div class="edit-box">
    <h3>编辑故事</h3>
    <label>标题</label><input type="text" id="editTitle">
    <label>内容</label><textarea id="editContent"></textarea>
    <div class="btn-row">
      <button class="tool-btn" onclick="closeEdit()">取消</button>
      <button class="tool-btn" style="background:var(--accent);color:#fff;border-color:var(--accent)" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>
<script>
var STOR='storybook_v3';
var stories=JSON.parse(localStorage.getItem(STOR)||'[]');
var currentPage=0,editingIdx=-1;
var pc=document.getElementById('pageContainer');
var pct=document.getElementById('pageContent');

function S(){localStorage.setItem(STOR,JSON.stringify(stories))}

function renderPage(){
  pc.scrollTop=0;
  var eb=document.getElementById('editBtn'),db=document.getElementById('deleteBtn');
  if(currentPage===0){
    pct.innerHTML='<div class="cover-center"><div class="orn">📖</div><h2>故事书</h2><p class="sub">收藏那些温柔的文字</p></div>';
    document.getElementById('prevBtn').disabled=true;
    document.getElementById('nextBtn').disabled=stories.length===0;
    eb.style.display='none';db.style.display='none';
  }else{
    var s=stories[currentPage-1];
    var h='<div class="page-num">'+currentPage+' / '+stories.length+'</div>';
    h+='<div class="story-title">'+esc(s.title)+'</div>';
    if(s.time)h+='<div class="story-time">'+s.time+'</div>';
    h+='<div class="story-content">'+esc(s.content)+'</div>';
    pct.innerHTML=h;
    document.getElementById('prevBtn').disabled=false;
    document.getElementById('nextBtn').disabled=currentPage>=stories.length;
    eb.style.display='inline-block';db.style.display='inline-block';
  }
}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

function nextPage(){if(currentPage<stories.length){currentPage++;renderPage()}}
function prevPage(){if(currentPage>0){currentPage--;renderPage()}}

function addStory(){
  var t=prompt('故事标题：','无标题');if(!t)return;
  var c=prompt('故事内容：','');if(c===null)return;
  var n=new Date();
  stories.push({title:t,content:c,time:n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')+' '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')});
  S();currentPage=stories.length;renderPage();
}

function deleteStory(){if(currentPage===0)return;if(confirm('确定删除「'+stories[currentPage-1].title+'」？')){stories.splice(currentPage-1,1);S();if(currentPage>stories.length)currentPage=stories.length;renderPage()}}

// ====== 目录 ======
function showTOC(){
  var list=document.getElementById('tocList');
  if(stories.length===0){list.innerHTML='<p style="text-align:center;color:#c4b090;padding:20px">还没有故事哦</p>'}
  else{
    var h='';
    for(var i=0;i<stories.length;i++){
      h+='<div class="toc-item" onclick="jumpTo('+i+')"><span class="dot"></span><span class="toc-title">'+esc(stories[i].title)+'</span><span class="toc-date">'+(stories[i].time||'')+'</span></div>';
    }
    list.innerHTML=h;
  }
  document.getElementById('tocOverlay').classList.add('show');
}
function hideTOC(){document.getElementById('tocOverlay').classList.remove('show')}
function jumpTo(i){currentPage=i+1;renderPage();hideTOC()}

// ====== 编辑 ======
function editStory(){
  if(currentPage===0)return;editingIdx=currentPage-1;
  document.getElementById('editTitle').value=stories[editingIdx].title;
  document.getElementById('editContent').value=stories[editingIdx].content;
  document.getElementById('editOverlay').classList.add('show');
}
function closeEdit(){document.getElementById('editOverlay').classList.remove('show')}
function saveEdit(){
  var t=document.getElementById('editTitle').value.trim();
  var c=document.getElementById('editContent').value.trim();
  if(!t){alert('标题不能为空');return}
  stories[editingIdx].title=t;stories[editingIdx].content=c;
  S();renderPage();closeEdit();
}

renderPage();
</script>
</body>
</html>
