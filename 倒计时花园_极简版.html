<!DOCTYPE html><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>倒计时花园</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:linear-gradient(180deg,#e8f5e8,#a5d6a7);min-height:100vh;font-family:PingFang SC,Microsoft YaHei,sans-serif;padding:12px}.hdr{text-align:center;color:#3d7a3d;padding:10px 0}.hdr h1{font-size:20px}.list{max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-bottom:90px}.c{background:rgba(255,255,255,.85);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;position:relative}.c.done{opacity:.5}.c .p{font-size:30px;min-width:36px;text-align:center}.c .m{flex:1;min-width:0}.c .t{font-size:14px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.c .dt{font-size:10px;color:#999}.c .n{font-size:24px;font-weight:bold;min-width:44px;text-align:right}.c .n.g{color:#3d7a3d}.c .n.o{color:#e67e22;animation:pls 1.5s infinite}.c .n.r{color:#c0392b}.c .nl{font-size:9px;color:#999;text-align:right}@keyframes pls{0%,100%{opacity:1}50%{opacity:.5}}.c .x{position:absolute;top:4px;right:6px;border:none;background:none;color:#ccc;font-size:12px;cursor:pointer}.c .x:hover{color:#e57373}.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);padding:10px 12px;display:flex;gap:6px;max-width:400px;margin:0 auto;border-radius:18px 18px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.05);z-index:10}.bar input,.bar button{padding:8px 10px;border-radius:16px;border:2px solid #c8e6c8;font-size:13px;outline:none;font-family:inherit}.bar input{flex:1;min-width:0}.bar input:focus{border-color:#4a8f4a}.bar button{background:#3d7a3d;color:#fff;border-color:#3d7a3d;font-weight:bold;padding:8px 16px}.emp{text-align:center;color:#999;padding:40px;font-size:13px}</style><div class="hdr"><h1>倒计时花园</h1></div><div class="list" id="ls"><div class="emp">在底部添加你的第一个倒计时吧</div></div><div class="bar"><input id="ni" placeholder="名称"><input type="date" id="di"><button onclick="add()">+</button></div><script>
var K='cd_g2',E=JSON.parse(localStorage.getItem(K)||'[]');
function S(){localStorage.setItem(K,JSON.stringify(E))}
function G(d){if(d<=0)return'\u{1F940}';if(d>365)return'\u{1F330}';if(d>180)return'\u{1F331}';if(d>90)return'\u{1F33F}';if(d>30)return'\u{1F333}';if(d>7)return'\u{1F337}';return'\u{1F338}'}
function add(){var n=document.getElementById('ni').value.trim(),d=document.getElementById('di').value;if(!n||!d)return;E.push({n:n,d:d+'T23:59:59'});E.sort(function(a,b){return new Date(a.d)-new Date(b.d)});S();R();document.getElementById('ni').value='';document.getElementById('di').value=''}
function rm(i){E.splice(i,1);S();R()}
function R(){var ls=document.getElementById('ls'),N=new Date();if(!E.length){ls.innerHTML='<div class="emp">在底部添加你的第一个倒计时吧</div>';return}var h='';for(var i=0;i<E.length;i++){var e=E[i],t=new Date(e.d),df=t.getTime()-N.getTime(),d=Math.ceil(df/86400000),c='',dc='',em='',lb='';if(d>0){dc='g';em=G(d);lb='天后'}else if(d===0){dc='o';em='\u{1F33B}';lb='今天!'}else{c='done';dc='r';em='\u{1F940}';lb='天前'}var ds=t.getFullYear()+'/'+(t.getMonth()+1)+'/'+t.getDate();h+='<div class="c '+c+'"><div class="p">'+em+'</div><div class="m"><div class="t">'+e.n+'</div><div class="dt">'+ds+'</div></div><div><div class="n '+dc+'">'+(d===0?'今':Math.abs(d))+'</div><div class="nl">'+lb+'</div></div><button class="x" onclick="rm('+i+')">x</button></div>'}ls.innerHTML=h}
R();setInterval(R,60000);
</script>
